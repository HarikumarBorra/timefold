<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: page('Access Denied', ~{::section})}">

<body>
	<section class="text-center py-5">
		<i class="bi bi-shield-exclamation fs-1 text-danger"></i>
		<h1 class="h3 fw-bold mt-3">Access Denied</h1>
		<p class="text-muted"
			th:text="${message != null ? message : 'You do not have permission to view this resource.'}"></p>
		<a th:href="@{/dashboard}" class="btn btn-primary btn-sm mt-2">Return to Dashboard</a>
	</section>
</body>

</html>
