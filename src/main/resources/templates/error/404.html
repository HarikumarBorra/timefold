<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Not Found', ~{::section})}">

<body>
	<section class="text-center py-5">
		<i class="bi bi-search fs-1 text-muted"></i>
		<h1 class="h3 fw-bold mt-3">Page or Capsule Not Found</h1>
		<p class="text-muted" th:text="${message != null ? message : 'The resource you requested could not be found.'}">
		</p>
		<a th:href="@{/dashboard}" class="btn btn-primary btn-sm mt-2">Return to Dashboard</a>
	</section>
</body>

</html>
