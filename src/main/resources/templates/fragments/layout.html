<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:fragment="page(pageTitle, content)">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle} + ' — TimeFold'">TimeFold</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		crossorigin="anonymous">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link th:href="@{/css/timefold.css}" rel="stylesheet">
</head>

<script th:src="@{/js/countdown.js}"></script>

<body>

	<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
		<div class="container">
			<a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" th:href="@{/}">
				<i class="bi bi-hourglass-split"></i>
				<span>TimeFold</span>
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#tfNavbar"
				aria-controls="tfNavbar" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="tfNavbar">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
					</li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/capsules/new}">New Capsule</a>
					</li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/capsules}">My Capsules</a>
					</li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
					    <a class="nav-link" th:href="@{/shared/new}">New Shared</a>
					</li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
					    <a class="nav-link" th:href="@{/invitations}">Invitations</a>
					</li>
					<li class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a class="nav-link text-danger" th:href="@{/admin}">Admin</a>
					</li>
				</ul>

				<div class="d-flex align-items-center gap-2">
					<th:block sec:authorize="isAnonymous()">
						<a class="btn btn-outline-primary btn-sm" th:href="@{/auth/login}">Log In</a>
						<a class="btn btn-primary btn-sm" th:href="@{/auth/register}">Get Started</a>
					</th:block>

					<th:block sec:authorize="isAuthenticated()">
						<a class="btn btn-outline-secondary btn-sm" th:href="@{/profile}">
							<i class="bi bi-person-circle me-1"></i>
							<span sec:authentication="name">User</span>
						</a>
						<form th:action="@{/auth/logout}" method="post" class="d-inline">
							<button type="submit" class="btn btn-outline-danger btn-sm">Log Out</button>
						</form>
					</th:block>
				</div>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${successMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
			<span th:text="${errorMessage}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>

		<div th:replace="${content}"></div>
	</main>

	<footer class="bg-white border-top py-3 mt-auto">
		<div
			class="container d-flex flex-column flex-sm-row justify-content-between align-items-center small text-muted">
			<span>&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> TimeFold — A message today. A
				memory tomorrow.</span>
			<span>Private by default &middot; UTC-verified unlocks</span>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		crossorigin="anonymous"></script>
</body>

</html>
