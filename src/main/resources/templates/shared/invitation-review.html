<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: page('Review Invitation', ~{::section})}">

<body>
	<section class="row justify-content-center">
		<div class="col-md-8 col-lg-6">
			<div class="card border-0 shadow-sm">
				<div class="card-body p-4 p-md-5 text-center">
					<i class="bi bi-people-fill fs-1 text-primary"></i>
					<h1 class="h4 fw-bold mt-3 mb-2">You're Invited to Contribute!</h1>
					<p class="text-muted mb-4">
						<strong th:text="${invitation.inviterName}">Owner</strong> invited you to add a message to
						<strong th:text="${invitation.capsuleTitle}">Shared Capsule</strong>.
					</p>

					<div class="bg-light border rounded-3 p-3 small text-muted mb-4">
						<div><strong>Scheduled Unlock:</strong> <span
								th:text="${invitation.unlockAtFormatted}">Date</span></div>
						<div><strong>Invitation Expires:</strong> <span
								th:text="${invitation.expiresAtFormatted}">Date</span></div>
					</div>

					<div class="d-flex justify-content-center gap-2">
						<form th:action="@{/invitations/{id}/accept(id=${invitation.invitationId})}" method="post">
							<button type="submit" class="btn btn-success px-4">
								<i class="bi bi-check-lg me-1"></i> Accept &amp; Join Capsule
							</button>
						</form>
						<form th:action="@{/invitations/{id}/decline(id=${invitation.invitationId})}" method="post">
							<button type="submit" class="btn btn-outline-danger">Decline</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
