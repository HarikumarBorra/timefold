<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: page('Forgot Password', ~{::section})}">

<body>
	<section class="row justify-content-center">
		<div class="col-md-6 col-lg-5">
			<div class="card border-0 shadow-sm">
				<div class="card-body p-4">
					<h2 class="h4 fw-bold mb-1">Reset your password</h2>
					<p class="text-muted small mb-4">We will send a secure 30-minute reset link to your email.</p>

					<form th:action="@{/auth/forgot-password}" th:object="${emailRequest}" method="post" novalidate>
						<div class="mb-4">
							<label for="email" class="form-label">Email Address</label>
							<input type="email" id="email" th:field="*{email}" class="form-control"
								th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
							<div class="invalid-feedback" th:errors="*{email}"></div>
						</div>
						<button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
					</form>

					<div class="text-center mt-3">
						<a th:href="@{/auth/login}" class="small text-decoration-none">Back to Log In</a>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
