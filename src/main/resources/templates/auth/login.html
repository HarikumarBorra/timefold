<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Log In', ~{::section})}">

<body>
	<section class="row justify-content-center">
		<div class="col-md-6 col-lg-5">
			<div class="card border-0 shadow-sm">
				<div class="card-body p-4">
					<h2 class="h4 fw-bold mb-1">Welcome back</h2>
					<p class="text-muted small mb-4">Log in to manage your time capsules.</p>

					<div th:if="${param.error}" class="alert alert-danger small" role="alert">
						Invalid email or password, or your account has not been verified yet.
						<a th:href="@{/auth/resend-verification}" class="alert-link d-block mt-1">Resend verification
							link</a>
					</div>
					<div th:if="${param.logout}" class="alert alert-info small" role="alert">
						You have been logged out securely.
					</div>

					<form th:action="@{/auth/login}" method="post">
						<div class="mb-3">
							<label for="username" class="form-label">Email Address</label>
							<input type="email" id="username" name="username" class="form-control" autocomplete="email"
								placeholder="you@example.com" required autofocus>
						</div>

						<div class="mb-2">
							<label for="password" class="form-label">Password</label>
							<input type="password" id="password" name="password" class="form-control"
								autocomplete="current-password" required>
						</div>

						<div class="d-flex justify-content-end mb-4">
							<a th:href="@{/auth/forgot-password}" class="small text-decoration-none">Forgot
								password?</a>
						</div>

						<button type="submit" class="btn btn-primary w-100">Log In</button>
					</form>

					<hr class="my-4">
					<p class="text-center small text-muted mb-0">
						New to TimeFold?
						<a th:href="@{/auth/register}" class="text-decoration-none fw-semibold">Create an account</a>
					</p>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
