<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: page('Set New Password', ~{::section})}">

<body>
	<section class="row justify-content-center">
		<div class="col-md-6 col-lg-5">
			<div class="card border-0 shadow-sm">
				<div class="card-body p-4">
					<h2 class="h4 fw-bold mb-1">Choose a new password</h2>
					<p class="text-muted small mb-4">Enter a strong password of at least 8 characters.</p>

					<form th:action="@{/auth/reset-password}" th:object="${resetPasswordRequest}" method="post"
						novalidate>
						<input type="hidden" th:field="*{token}">

						<div class="mb-3">
							<label for="newPassword" class="form-label">New Password</label>
							<input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
								th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" required>
							<div class="invalid-feedback" th:errors="*{newPassword}"></div>
						</div>

						<div class="mb-4">
							<label for="confirmPassword" class="form-label">Confirm New Password</label>
							<input type="password" id="confirmPassword" th:field="*{confirmPassword}"
								class="form-control"
								th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" required>
							<div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
						</div>

						<button type="submit" class="btn btn-primary w-100">Update Password</button>
					</form>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
