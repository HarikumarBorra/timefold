<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: page('My Capsules', ~{::section})}">

<body>
	<section>
		<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
			<div>
				<h1 class="h3 fw-bold mb-1">My Capsules</h1>
				<p class="text-muted small mb-0">Filter by lifecycle state or start a new time capsule.</p>
			</div>
			<a th:href="@{/capsules/new}" class="btn btn-primary btn-sm">
				<li class="nav-item"
					th:each="tab : ${ {'ALL', 'PERSONAL', 'SHARED', 'DRAFT', 'SEALED', 'READY', 'OPENED', 'CANCELLED'} }">
			</a>
		</div>

		<div class="d-flex gap-2">
			<a th:href="@{/capsules/new}" class="btn btn-primary btn-sm">
				<i class="bi bi-plus-lg me-1"></i> Personal Capsule
			</a>
			<a th:href="@{/shared/new}" class="btn btn-outline-primary btn-sm">
				<i class="bi bi-people-fill me-1"></i> Shared Capsule
			</a>
		</div>

		<ul class="nav nav-pills gap-1 mb-4">
			<li class="nav-item" th:each="tab : ${ {'ALL', 'DRAFT', 'SEALED', 'READY', 'OPENED', 'CANCELLED'} }">
				<a class="nav-link py-1 px-3 small" th:href="@{/capsules(status=${tab})}"
					th:classappend="${activeFilter == tab} ? 'active' : 'bg-white border text-dark'"
					th:text="${tab}">ALL</a>
			</li>
		</ul>

		<div th:if="${capsulesPage.isEmpty()}" class="card border-0 shadow-sm">
			<div class="card-body p-5 text-center">
				<i class="bi bi-inbox fs-1 text-muted"></i>
				<p class="text-muted mt-3 mb-3">No capsules found in this category.</p>
				<a th:href="@{/capsules/new}" class="btn btn-primary btn-sm">Create One Now</a>
			</div>
		</div>

		<div th:if="${!capsulesPage.isEmpty()}" class="row g-3">
			<div class="col-md-6 col-lg-4" th:each="c : ${capsulesPage.content}">
				<div class="card border-0 shadow-sm h-100 tf-card-hover">
					<div class="card-body d-flex flex-column">
						<div class="d-flex justify-content-between align-items-center mb-2">
							<span class="badge" th:text="${c.effectiveStatus}"
								th:classappend="${c.effectiveStatus.name() == 'READY'} ? 'text-bg-success' :
                                              (${c.effectiveStatus.name() == 'SEALED'} ? 'text-bg-primary' :
                                              (${c.effectiveStatus.name() == 'DRAFT'} ? 'text-bg-warning' :
                                              (${c.effectiveStatus.name() == 'OPENED'} ? 'text-bg-secondary' : 'text-bg-danger')))">
								STATUS
							</span>
							<span class="badge text-bg-light border small" th:text="${c.theme}">CLASSIC</span>
							<span class="badge text-bg-light border small" th:text="${c.capsuleType}">PERSONAL</span>
						</div>

						<h2 class="h6 fw-bold mb-1" th:text="${c.title}">Title</h2>
						<p class="small text-muted flex-grow-1 mb-3"
							th:text="${c.description != null ? c.description : 'Personal time capsule'}"></p>

						<div class="small text-muted mb-3">
							<i class="bi bi-calendar-event me-1"></i>
							<span th:text="${c.unlockAtFormatted}">Date</span>
							<div th:if="${c.effectiveStatus.name() == 'SEALED'}" class="fw-semibold text-primary mt-1"
								th:attr="data-unlock-utc=${c.unlockAtUtcIso}" data-compact="true">Calculating...</div>
						</div>

						<a th:href="@{/capsules/{id}(id=${c.publicId})}" class="btn btn-outline-primary btn-sm w-100">
							Manage / View
						</a>
					</div>
				</div>
			</div>
		</div>

		<!-- Pagination -->
		<nav th:if="${capsulesPage.totalPages > 1}" class="mt-4" aria-label="Capsule pagination">
			<ul class="pagination justify-content-center">
				<li class="page-item" th:classappend="${capsulesPage.first} ? 'disabled'">
					<a class="page-link"
						th:href="@{/capsules(status=${activeFilter}, page=${capsulesPage.number - 1})}">Previous</a>
				</li>
				<li class="page-item disabled">
					<span class="page-link"
						th:text="'Page ' + (${capsulesPage.number + 1}) + ' of ' + ${capsulesPage.totalPages}"></span>
				</li>
				<li class="page-item" th:classappend="${capsulesPage.last} ? 'disabled'">
					<a class="page-link"
						th:href="@{/capsules(status=${activeFilter}, page=${capsulesPage.number + 1})}">Next</a>
				</li>
			</ul>
		</nav>
	</section>
</body>

</html>
