spring:
  datasource:
    url: jdbc:mysql://localhost:3306/timefold_db?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:timefold_dev}
    password: ${DB_PASSWORD:TimeFoldDev#2026}

  thymeleaf:
    cache: false

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.timefold: DEBUG
    org.flywaydb: INFO